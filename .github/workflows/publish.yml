name: Demand Intelligence & Forecasting QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'src/**'
      - 'tests/**'
      - 'app.py'
      - 'reproduce.py'
      - 'scripts/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py reproduce.py src scripts tests

      - name: Run analytical unit tests
        run: python -m pytest -q

      - name: Fetch and verify UCI data
        run: python scripts/fetch_uci_data.py

      - name: Reproduce model and review results
        run: python reproduce.py

      - name: Verify final holdout and queue
        run: |
          python - <<'PY'
          import pandas as pd
          s=pd.read_csv("outputs/policy_overall_metrics.csv").set_index("strategy")
          queue=pd.read_csv("outputs/prospective_review_queue.csv")
          assert len(queue)==811 and queue["product"].is_unique
          assert (queue["forecast_next_week"]>=0).all()
          assert abs(s.loc["naive","wape"]-0.33731955844891026)<1e-9
          assert abs(s.loc["ses","wape"]-0.27450534320777015)<1e-9
          assert abs(s.loc["segmented_policy","wape"]-0.2763036605922975)<1e-9
          assert queue["review_tier"].value_counts().to_dict()=={
              "High":7,"Medium":293,"Routine":511
          },queue["review_tier"].value_counts()
          print("PASS: forecast metrics and product-aligned review tiers")
          PY

      - name: Smoke test bilingual dashboard
        run: python tests/smoke_app.py

      - name: Commit verified public UCI data and model outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/Sales_Transactions_Dataset_Weekly.csv outputs/*.csv
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "data: publish verified UCI source and reproducible outputs"
            git push
          fi
